        function GetURLParameter(name, noRegExpReplace) {
            let regExp = new RegExp('[?|&]' + name + '=' + '([^&;]+?)(&|#|;|$)').exec(location.search);
            let result;
            let decodeURI;

            if (regExp) {
                result = (regExp || [, ''])[1];

                if (!noRegExpReplace) {
                    result = result.replace(/\+/g, '%20');
                }

                decodeURI = decodeURIComponent(result);
            }

            return decodeURI || null;
        }
    </script>
